name: Generar sprites PNG BOLITA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/generar_sprites_bolita.py'
permissions:
  contents: write
jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python tools/generar_sprites_bolita.py
      - name: Publicar PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bolita/*.png
          git diff --cached --quiet || (git commit -m "Añadir sprites PNG transparentes BOLITA" && git push)
