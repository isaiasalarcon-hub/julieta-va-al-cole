<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOLITA · Julieta va al cole</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,'Arial Rounded MT Bold',sans-serif;color:#512608}body{background:#1b425b url('file_000000008d4881f4a3c713f0a9f55d4d.png') center center/cover fixed no-repeat;display:grid;place-items:center;padding:12px}body:before{content:'';position:fixed;inset:0;background:#15354855;pointer-events:none}.board{position:relative;width:min(100%,470px);background:linear-gradient(#fff3d2,#ffedc5);border:7px solid #8b461d;border-radius:28px;padding:25px 13px 18px;box-shadow:0 9px 0 #5d2d13,0 19px 40px #0009;text-align:center}.brand{position:relative;margin:-13px 2px 15px;background:linear-gradient(#ffd995,#eeb268);border:4px solid #9d5325;border-radius:19px;padding:10px 4px;font-size:clamp(24px,6vw,34px);font-weight:1000;box-shadow:0 5px 0 #aa6530}.instruction{background:#fff7e3;border:3px solid #d49a4e;border-radius:17px;padding:10px 5px;font-weight:900;font-size:clamp(16px,4vw,20px);min-height:53px}.table{position:relative;margin:15px 0 12px;height:220px;border:5px solid #7b3a17;border-radius:18px;background:repeating-linear-gradient(0deg,#dd9249 0 24px,#e9a75b 25px 27px,#d18a40 28px 29px);box-shadow:inset 0 9px #f8c47c,inset 0 -16px #a65c2b,0 7px #633013;overflow:hidden}.table:after{content:'';position:absolute;left:0;right:0;bottom:16px;height:2px;background:#a75a2a66}.cup{position:absolute;top:64px;left:0;width:33.333%;height:126px;border:0;background:transparent;display:grid;place-items:center;padding:0;transition:transform .5s cubic-bezier(.3,.7,.3,1),top .28s;z-index:2;cursor:pointer;touch-action:manipulation}.cup svg{width:min(96%,112px);height:124px;filter:drop-shadow(2px 8px 2px #57270b66)}.cup:disabled{opacity:1}.cup:focus-visible{outline:3px solid #fff;border-radius:12px}.ball{position:absolute;top:156px;left:calc(16.666% - 11px);width:23px;height:23px;background:radial-gradient(circle at 30% 25%,white 0 8%,#ff7373 14%,#e9152b 55%,#960017 100%);border:2px solid #9b0c1e;border-radius:50%;box-shadow:0 4px 2px #4b220855;transition:left .5s;z-index:1}.status{background:#ffe0a0;border:3px solid #d49a4e;border-radius:16px;padding:11px 6px;font-size:clamp(16px,4vw,20px);font-weight:900;min-height:65px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.actions button{border:3px solid #6b3c1c;background:linear-gradient(#83d66c,#36a74c);color:#fff;border-radius:13px;padding:11px 13px;font-weight:900;font-size:15px;box-shadow:0 4px #336a32}.actions button.secondary{background:linear-gradient(#7ac6ef,#2580b3);box-shadow:0 4px #1e587b}.actions button:disabled{opacity:.55}.note{font-size:12px;color:#74482b;margin-top:14px}.cup.wobble svg{animation:wobble .42s}@keyframes wobble{0%,100%{rotate:0deg}30%{rotate:10deg}70%{rotate:-10deg}}@media(max-height:720px){.board{padding-top:14px}.table{height:195px}.cup{top:49px}.ball{top:143px}}

</style></head><body><svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs><linearGradient id="wood" x1="0" x2="1"><stop stop-color="#7e3618"/><stop offset=".16" stop-color="#bd6c2a"/><stop offset=".38" stop-color="#ffbd68"/><stop offset=".67" stop-color="#d08038"/><stop offset="1" stop-color="#78310e"/></linearGradient><linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffdc9b"/><stop offset=".45" stop-color="#c7792e"/><stop offset="1" stop-color="#8b3d19"/></linearGradient></defs><symbol id="woodcup" viewBox="0 0 110 130"><path d="M24 13 Q55 0 86 13 L105 107 Q106 125 55 125 Q4 125 5 107 Z" fill="url(#wood)" stroke="#2f140a" stroke-width="4"/><path d="M22 16 10 99 Q55 116 100 99 L88 16" fill="none" stroke="#9d4c20" stroke-width="2"/><path d="M35 18 26 95 M45 18 43 98 M70 18 75 99 M82 18 93 96" stroke="#8b3e19" stroke-width="1.6" opacity=".6"/><ellipse cx="55" cy="15" rx="33" ry="10" fill="#e49a46" stroke="#3b1c0c" stroke-width="3"/><ellipse cx="55" cy="13" rx="28" ry="7" fill="#efaf59" stroke="#ffdc9b" stroke-width="2"/><path d="M7 100 Q55 117 103 100 L105 111 Q55 132 5 111 Z" fill="url(#band)" stroke="#321609" stroke-width="3"/><path d="M9 104 Q55 121 101 104" stroke="#ffe0a2" stroke-width="3" fill="none"/></symbol></svg>
<main class="board"><div class="brand" id="playerBrand">🎮 ISAÍAS 🎮</div><div class="instruction" id="instruction">¡Mira bien dónde está la bolita!</div><div class="table" id="table"><div class="ball" id="ball"></div><button class="cup" data-id="0" aria-label="Cubilete 1"><svg viewBox="0 0 110 130"><use href="#woodcup"/></svg></button><button class="cup" data-id="1" aria-label="Cubilete 2"><svg viewBox="0 0 110 130"><use href="#woodcup"/></svg></button><button class="cup" data-id="2" aria-label="Cubilete 3"><svg viewBox="0 0 110 130"><use href="#woodcup"/></svg></button></div><div class="status" id="status">Pulsa EMPEZAR para jugar</div><div class="actions"><button id="start">▶ EMPEZAR</button><button id="again" hidden>↻ OTRA PARTIDA</button><button class="secondary" onclick="location.href='index.html'">VOLVER AL JUEGO</button></div><div class="note">Versión independiente de pruebas · BOLITA</div></main><script>
const jugadorParam=new URLSearchParams(location.search).get('jugador');const jugadorElegido=jugadorParam==='nacho'||jugadorParam==='isaias'?jugadorParam:(localStorage.getItem('julietaJugador')||'isaias');document.getElementById('playerBrand').textContent='🎮 '+(jugadorElegido==='nacho'?'NACHO':'ISAÍAS')+' 🎮';

(function(){const paths=['mesa.png','cubilete.png','bolita.png'];Promise.all(paths.map(n=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src='assets/bolita/'+n+'?v=recorte4'}))).then(()=>document.getElementById('table').classList.add('png-sprites')).catch(()=>console.info('BOLITA: esperando los sprites PNG de GitHub'))})();
const cups=[...document.querySelectorAll('.cup')],ball=document.getElementById('ball'),status=document.getElementById('status'),instruction=document.getElementById('instruction'),start=document.getElementById('start'),again=document.getElementById('again');let pos=[0,1,2],hidden=0,choosing=false,busy=false,round=0;const wait=t=>new Promise(r=>setTimeout(r,t));function draw(){cups.forEach((c,i)=>{c.style.transform='translateX('+(pos[i]*100)+'%)';c.disabled=!choosing});ball.style.left='calc('+( (pos[hidden]+.5)*100/3 )+'% - 11px)'}function reset(){round++;choosing=false;busy=false;pos=[0,1,2];hidden=Math.floor(Math.random()*3);cups.forEach(c=>{c.style.top='39px';c.classList.remove('wobble')});ball.style.opacity='1';draw();status.textContent='¡Fíjate en la bolita roja!';instruction.textContent='¡Mira bien dónde está la bolita!';start.hidden=true;again.hidden=true}async function play(){reset();const token=round;cups[hidden].style.top='0px';await wait(1600);if(token!==round)return;cups[hidden].style.top='64px';await wait(550);if(token!==round)return;ball.style.opacity='0';status.textContent='¡Mezclando los cubiletes!';busy=true;for(let n=0;n<8;n++){let a=Math.floor(Math.random()*3),b=(a+1+Math.floor(Math.random()*2))%3;[pos[a],pos[b]]=[pos[b],pos[a]];cups[a].classList.add('wobble');cups[b].classList.add('wobble');draw();await wait(540);if(token!==round)return;cups.forEach(c=>c.classList.remove('wobble'))}busy=false;choosing=true;draw();instruction.textContent='¿Dónde está la bolita?';status.textContent='¡Toca un cubilete para adivinar!'}cups.forEach((c,i)=>c.onclick=()=>{if(!choosing||busy)return;choosing=false;draw();cups[hidden].style.top='15px';ball.style.opacity='1';status.textContent=i===hidden?'⭐ ¡CORRECTO! ⭐':'❌ ¡INTÉNTALO DE NUEVO!';instruction.textContent=i===hidden?'¡Has encontrado la bolita!':'La bolita estaba aquí';again.hidden=false});start.onclick=play;again.onclick=play;draw();
</script></body></html>
